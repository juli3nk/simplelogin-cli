name: ci

on:
  push:
    branches:
      - develop

env:
  DAGGER_NO_NAG: "1"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GO_VERSION: "1.26.5"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify (repository + Go quality checks)
        uses: dagger/dagger-for-github@8.0.0
        with:
          call: verify --source=. --go-version=${{ env.GO_VERSION }} --github-token=env:GH_TOKEN --github-owner=o5carm --github-repo=simplelogin-cli

  build:
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build multi-platform binaries
        uses: dagger/dagger-for-github@8.0.0
        with:
          call: build --source=. --go-version=${{ env.GO_VERSION }} --github-token=env:GH_TOKEN --github-owner=o5carm --github-repo=simplelogin-cli --name=simplelogin-cli --packages=./cmd/simplelogin-cli
