name: release

on:
  push:
    branches:
      - main

env:
  DAGGER_NO_NAG: "1"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GO_VERSION: "1.26.5"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release (semantic-release + binaries as assets)
        uses: dagger/dagger-for-github@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          call: release --source=. --go-version=${{ env.GO_VERSION }} --github-token=env:GITHUB_TOKEN --github-owner=o5carm --github-repo=simplelogin-cli --name=simplelogin-cli --packages=./cmd/simplelogin-cli --repository-url=https://github.com/o5carm/simplelogin-cli --dry-run=false

      - name: Set Output Tag
        id: get_tag
        run: |
          git fetch --tags --force
          echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
